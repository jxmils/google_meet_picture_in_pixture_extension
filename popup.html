<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet Person Float</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="mark" aria-hidden="true">↗</div>
  <h1>Keep one person in view.</h1>
  <p>Choose their video in Google Meet. It opens in a floating window you can move and resize.</p>
  <button id="choose" type="button">Choose a person</button>
  <p id="status" role="status">Open a Google Meet call to begin.</p>
  <p class="note">For your view only. Share a tab or specific window if you don’t want the floating video in your screen share.</p>
  <script src="popup.js"></script>
</body>
</html>
